<!DOCTYPE html>
<html lang="en" data-design="deco">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ralf</title>
    <meta name="description" content="Ralf's personal website with contact info and photography" />
    <!-- Local system font stack for zero external dependencies -->
    <link rel="stylesheet" href="layout.css?v=20261002-2" />
    <link rel="stylesheet" href="themes/deco.css?v=20260813-1" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <main class="site">
      <div class="profile">
      <!-- Theme Toggle Switch -->
      <div class="theme-toggle">
        <div class="theme-toggle__switch" role="group" aria-label="Theme preference">
          <button class="theme-toggle__option" type="button" data-theme-option="system" aria-pressed="false" aria-label="Use system theme" title="System">
            <span class="theme-toggle__icon theme-toggle__icon--system" aria-hidden="true">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <path d="M8 21h8m-4-4v4"/>
              </svg>
            </span>
          </button>
          <button class="theme-toggle__option" type="button" data-theme-option="dark" aria-pressed="false" aria-label="Use dark theme" title="Dark">
            <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </span>
          </button>
          <button class="theme-toggle__option" type="button" data-theme-option="light" aria-pressed="false" aria-label="Use light theme" title="Light">
            <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/>
              </svg>
            </span>
          </button>
        </div>
      </div>
      <section class="card" aria-labelledby="name" aria-describedby="tagline">
        <header class="card__header">
          <h1 id="name" class="name">Ralf</h1>
          <p id="tagline" class="tagline">The past has no power over the present moment.</p>
          <img class="card__crest" src="photos/family-crest.png" alt="Family crest" width="314" height="432" />
        </header>
        <div class="divider" aria-hidden="true"></div>
        <nav class="links" aria-label="Primary">
          <a class="btn btn--linkedin" href="https://www.linkedin.com/in/ralfvb/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile (opens in new tab)">
            <span class="btn__icon" aria-hidden="true">
              <!-- LinkedIn official glyph -->
              <svg viewBox="0 0 24 24" role="img" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.352V9h3.414v1.561h.049c.476-.9 1.637-1.852 3.37-1.852 3.604 0 4.262 2.372 4.262 5.455v6.288Zm-15.11-13.02a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124ZM7.119 20.452H3.554V9h3.565v11.452ZM22.225 0H1.771A1.27 1.27 0 0 0 .5 1.246v21.507A1.27 1.27 0 0 0 1.771 24h20.451a1.27 1.27 0 0 0 1.271-1.247V1.246A1.27 1.27 0 0 0 22.225 0Z"/></svg>
            </span>
            <span class="btn__text">LinkedIn</span>
          </a>
          <a class="btn btn--github" href="https://github.com/ralfvb" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile (opens in new tab)">
            <span class="btn__icon" aria-hidden="true">
              <!-- GitHub mark -->
              <svg viewBox="0 0 24 24" role="img" xmlns="http://www.w3.org/2000/svg"><path d="M12 .5C5.648.5.5 5.648.5 12c0 5.086 3.292 9.388 7.868 10.907.575.103.786-.25.786-.556 0-.274-.01-1-.015-1.964-3.201.695-3.877-1.543-3.877-1.543-.523-1.328-1.278-1.681-1.278-1.681-1.044-.714.079-.699.079-.699 1.155.081 1.763 1.187 1.763 1.187 1.027 1.76 2.694 1.252 3.35.957.104-.744.402-1.253.73-1.54-2.554-.291-5.238-1.277-5.238-5.683 0-1.255.45-2.281 1.186-3.085-.119-.29-.515-1.462.112-3.049 0 0 .967-.31 3.168 1.178a11.02 11.02 0 0 1 2.885-.388c.978.005 1.964.132 2.885.388 2.2-1.488 3.165-1.178 3.165-1.178.629 1.587.233 2.759.114 3.049.739.804 1.184 1.83 1.184 3.085 0 4.417-2.69 5.388-5.254 5.673.414.357.78 1.059.78 2.137 0 1.542-.014 2.784-.014 3.164 0 .309.208.665.792.553C20.213 21.384 23.5 17.084 23.5 12c0-6.352-5.148-11.5-11.5-11.5Z"/></svg>
            </span>
            <span class="btn__text">GitHub</span>
          </a>
          <a class="btn btn--unsplash" href="https://unsplash.com/@ralfvb" target="_blank" rel="noopener noreferrer" aria-label="Unsplash profile (opens in new tab)">
            <span class="btn__icon" aria-hidden="true">
              <!-- Unsplash logo -->
              <svg viewBox="0 0 24 24" role="img" xmlns="http://www.w3.org/2000/svg"><path d="M7.5 6.75V0h9v6.75h-9zm9 3.75H24V24H0V10.5h7.5v6.75h9V10.5z"/></svg>
            </span>
            <span class="btn__text">Unsplash</span>
          </a>
        </nav>
      </section>
      <figure class="polaroid" aria-label="Photo of Ralf">
        <img data-random-photo src="photos/rvb-photo (1).jpg" alt="" loading="lazy" />
      </figure>
      <div class="card__tag" aria-label="100% tracker free">
        <div class="card__tag-paper">100% tracker free</div>
      </div>
      </div>
    </main>

    <script>
      // Theme switcher: system / dark / light ("system" follows prefers-color-scheme)
      (() => {
        const html = document.documentElement;
        const options = document.querySelectorAll('[data-theme-option]');
        const systemMedia = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        const getSystemTheme = () => (systemMedia?.matches ? 'dark' : 'light');
        const getStoredPreference = () => {
          const stored = localStorage.getItem('theme');
          return stored === 'light' || stored === 'dark' ? stored : 'system';
        };

        let preference = getStoredPreference();

        const apply = () => {
          html.setAttribute('data-theme', preference === 'system' ? getSystemTheme() : preference);
          options.forEach((option) => {
            option.setAttribute('aria-pressed', String(option.dataset.themeOption === preference));
          });
        };

        const setPreference = (next) => {
          preference = next;
          if (next === 'system') {
            localStorage.removeItem('theme');
          } else {
            localStorage.setItem('theme', next);
          }
          apply();
        };

        options.forEach((option) => {
          option.addEventListener('click', () => setPreference(option.dataset.themeOption));
        });

        systemMedia?.addEventListener('change', () => {
          if (preference === 'system') apply();
        });

        apply();
      })();

      // Random photo loader
      (function() {
        const imgEl = document.querySelector('[data-random-photo]');
        if (!imgEl) return;
        const photoNumbers = [1, ...Array.from({ length: 45 }, (_, index) => index + 35)];
        const photos = photoNumbers.map((photoNumber) => `photos/rvb-photo (${photoNumber}).jpg`);
        
        // Function to pick a random photo
        const pickRandomPhoto = () => {
          return photos[Math.floor(Math.random() * photos.length)];
        };
        
        // Set initial random photo
        imgEl.src = pickRandomPhoto();
        
        // Change photo on click
        imgEl.addEventListener('click', () => {
          imgEl.src = pickRandomPhoto();
        });
        
        // Add cursor pointer to indicate it's clickable
        imgEl.style.cursor = 'pointer';
      })();
    </script>
  </body>
</html>
